spring.application.name=${SPRING_APPLICATION_NAME}

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=${JPA_DDL}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}
#spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
server.servlet.context-path=/pms
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}

logging.level.org.modelmapper=INFO
user.service.url=${ISSUER_URI}
rms.service.url=${RMS_SERVICE_URL}

# RMS polling interval in milliseconds (default: 10 minutes)
rms.polling.interval-ms=100000
spring.cache.type=caffeine
spring.cache.cache-names=users,roles,allUsers,userRoles
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
management.endpoints.web.exposure.include=mappings
management.endpoint.mappings.enabled=true

# external.auth.url=${EXTERNAL_AUTH_URL}

# Default statuses for new projects
#project.default-statuses[0].name=Backlog
#project.default-statuses[0].sortOrder=1
project.default-statuses[0].name=To Do
project.default-statuses[0].sortOrder=1
project.default-statuses[1].name=In Progress
project.default-statuses[1].sortOrder=2
project.default-statuses[2].name=Done
project.default-statuses[2].sortOrder=3

# related to sprint end how tasks and sprints should be handled
# how many hours before end we prompt FE (default: 24)
sprint.prompt.window.hours=24

# burndown snapshot scheduler - runs at midnight daily
sprint.scheduler.cron=0 0 0 * * *
# sprint expiry check - runs every minute
sprint.expiry.scheduler.cron=0 * * * * *

# milestone auto-start - moves PLANNED milestones to IN_PROGRESS on their planned start date.
# Hourly at :10 so a missed slot costs at most an hour; MilestoneAutoStartRunner also catches
# up at startup. The job is idempotent, so the extra runs are free.
milestone.autostart.scheduler.cron=0 10 * * * *

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.jackson.serialization.fail-on-empty-beans=false
